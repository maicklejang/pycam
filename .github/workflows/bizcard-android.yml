name: BizCard Android APK

on:
  push:
    branches: ["**"]
    paths:
      - "android/bizcard/**"
      - ".github/workflows/bizcard-android.yml"
  pull_request:
    paths:
      - "android/bizcard/**"
      - ".github/workflows/bizcard-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build installable APK
    runs-on: ubuntu-latest
    # 설치용 APK 를 프리릴리스로 올리기 위해 쓰기 권한이 필요하다.
    permissions:
      contents: write
    defaults:
      run:
        working-directory: android/bizcard

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run parser unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      # 서명 키가 없으면 unsigned APK 가 나온다. 설치용 결과물은 debug APK 이므로
      # 릴리스 빌드가 실패해도 워크플로 전체를 막지 않는다.
      - name: Build release APK
        continue-on-error: true
        run: ./gradlew --no-daemon assembleRelease

      - name: Rename artifacts
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/bizcard-scanner-debug.apk
          release_apk="$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)"
          if [ -n "$release_apk" ]; then
            cp "$release_apk" "out/bizcard-scanner-release-$(basename "$release_apk")"
          fi
          ls -la out

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bizcard-scanner-apk
          path: android/bizcard/out/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bizcard-unit-test-report
          path: android/bizcard/app/build/reports/tests/
          if-no-files-found: ignore

      # 아티팩트는 GitHub 로그인이 필요하고 zip 으로 묶여 나와서 휴대폰에서 받기 번거롭다.
      # 같은 태그의 프리릴리스에 APK 를 갈아 끼워, 로그인 없이 받을 수 있는 고정 주소를 둔다.
      - name: Publish APK to the install prerelease
        if: >-
          github.event_name == 'workflow_dispatch' ||
          github.ref == 'refs/heads/master' ||
          github.ref == 'refs/heads/claude/business-card-contact-extractor-bs94u2'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: bizcard-latest
        run: |
          set -euo pipefail
          cp out/bizcard-scanner-debug.apk out/bizcard-scanner.apk

          notes="$(cat <<EOF
          휴대폰에서 바로 설치할 수 있는 명함 스캐너 APK 입니다.

          - 설치 파일: [bizcard-scanner.apk](https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/bizcard-scanner.apk)
          - 디버그 키로 서명되어 있어 설치 시 "출처를 알 수 없는 앱" 허용이 필요합니다.
          - 이 파일은 \`${GITHUB_REF_NAME}\` 브랜치의 \`${GITHUB_SHA}\` 커밋을 빌드한 결과이며, 푸시마다 갱신됩니다.
          EOF
          )"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" out/bizcard-scanner.apk --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes "$notes"
          else
            gh release create "$TAG" out/bizcard-scanner.apk \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "명함 스캐너 설치 파일 (최신)" \
              --prerelease \
              --notes "$notes"
          fi

          echo "설치 주소: https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/bizcard-scanner.apk"
