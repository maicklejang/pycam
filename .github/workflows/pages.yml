name: Deploy mobile viewer

# Publishes mobile/ (the STL/STEP/DXF viewer) to GitHub Pages.
#
# Only the mobile/ directory is uploaded, on purpose: the artifact step resolves
# symlinks, and debian/pycam.mime in the repository root is a dangling one, which
# makes a whole-repository deployment fail.
#
# Requires "Settings -> Pages -> Source" to be set to "GitHub Actions".

on:
  push:
    branches:
      - master
      - claude/stl-step-dxf-mobile-app-wvtxta
    paths:
      - 'mobile/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: mobile

      - id: deployment
        uses: actions/deploy-pages@v4
