name: Build Android app

# Builds the APK wrapper around mobile/ and publishes it as a pre-release, so it
# can be installed on a phone straight from the download link.
#
# The APK is signed with the committed sideload key (android/sideload.keystore) so
# that every build keeps the same signature and installs as an update.  It is a
# throwaway self-signed key, not a store key.

on:
  push:
    branches:
      - master
      - claude/stl-step-dxf-mobile-app-wvtxta
    paths:
      - 'android/**'
      - 'mobile/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build the APK
        env:
          PYCAM_BUILD_NUMBER: ${{ github.run_number }}
        run: gradle --project-dir android --no-daemon assembleDebug

      - name: Rename the APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/pycam-viewer.apk
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: pycam-viewer-apk
          path: dist/pycam-viewer.apk

      - name: Publish it as the android-latest pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view android-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create android-latest \
              --repo "$GITHUB_REPOSITORY" \
              --prerelease \
              --title "PyCAM Viewer for Android" \
              --notes "Sideload build of the STL/STEP/DXF viewer. Signed with a debug key, so Android will ask you to allow installing from an unknown source. Rebuilt automatically whenever mobile/ or android/ changes."
          gh release upload android-latest dist/pycam-viewer.apk \
            --repo "$GITHUB_REPOSITORY" --clobber
