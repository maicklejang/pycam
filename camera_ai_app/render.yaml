# One-click deploy on Render (https://render.com) -> free HTTPS address.
services:
  - type: web
    name: camera-ai
    runtime: docker
    rootDir: camera_ai_app
    plan: free
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
