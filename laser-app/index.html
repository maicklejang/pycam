<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12151c">
<meta name="description" content="소재별 레이저 절단·조각 파워와 속도를 장비 출력에 맞춰 계산해 주고, 필요한 재료를 바로 주문할 수 있는 앱입니다.">
<title>레이저 소재 가이드</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="레이저 가이드">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<header class="topbar">
  <button class="brand" id="brandBtn">
    <span class="brand-mark"></span>
    <span class="brand-text" id="brandText">레이저 소재 가이드</span>
  </button>
  <button class="chip machine-chip" id="machineBtn" aria-label="장비 설정">장비 선택</button>
  <button class="icon-btn" id="cartBtn" aria-label="장바구니">
    <span class="cart-glyph">장바구니</span><span class="badge" id="cartBadge" hidden>0</span>
  </button>
</header>

<main id="main">
  <section class="view" id="view-calc"></section>
  <section class="view" id="view-shop" hidden></section>
  <section class="view" id="view-grid" hidden></section>
  <section class="view" id="view-log" hidden></section>
  <section class="view" id="view-safety" hidden></section>
</main>

<nav class="tabbar" id="tabbar">
  <button data-view="calc" class="active"><b>설정</b><small>파워·속도</small></button>
  <button data-view="shop"><b>재료</b><small>주문</small></button>
  <button data-view="grid"><b>테스트</b><small>G코드</small></button>
  <button data-view="log"><b>기록</b><small>내 설정</small></button>
  <button data-view="safety"><b>안전</b><small>금지소재</small></button>
</nav>

<div class="sheet-backdrop" id="sheetBackdrop" hidden></div>
<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true">
  <div class="sheet-head">
    <h2 id="sheetTitle"></h2>
    <button class="icon-btn" id="sheetClose" aria-label="닫기">닫기</button>
  </div>
  <div class="sheet-body" id="sheetBody"></div>
</div>

<div class="toast" id="toast" hidden></div>

<script src="js/config.js"></script>
<script src="js/materials.js"></script>
<script src="js/shop.js"></script>
<script src="js/engine.js"></script>
<script src="js/store.js"></script>
<script src="js/testgrid.js"></script>
<script src="js/app.js"></script>
</body>
</html>
