<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>docscan · 문서 스캐너</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="카메라로 문서를 찍어 기울기를 펴고 PDF로 저장하는 스캐너">
<meta name="theme-color" content="#0f1115">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="./icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="docscan">
<link rel="stylesheet" href="./app.css">
</head>
<body>

<header class="bar bar--top">
  <span class="brand">docscan</span>
  <span id="status" class="status">준비 중…</span>
  <button id="install" class="chip chip--ghost" hidden>앱 설치</button>
</header>

<main id="stage" class="stage">
  <video id="video" playsinline muted autoplay></video>
  <canvas id="overlay" class="overlay"></canvas>

  <div id="splash" class="splash">
    <div class="spinner" aria-hidden="true"></div>
    <p id="splash-text">이미지 엔진 준비 중…</p>
  </div>

  <div id="permission" class="splash splash--message" hidden>
    <h2>카메라를 열 수 없습니다</h2>
    <p id="permission-text"></p>
    <button class="btn" id="retry-camera">다시 시도</button>
    <button class="btn btn--ghost" id="permission-pick">사진에서 불러오기</button>
  </div>

  <div id="flash" class="flash" hidden></div>
  <p id="toast" class="toast" hidden></p>
</main>

<footer class="bar bar--bottom">
  <div id="modes" class="modes" role="group" aria-label="색 모드"></div>

  <div class="controls">
    <button id="gallery" class="round round--side" aria-label="촬영한 페이지">
      <span id="page-count" class="badge">0</span>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h11v11H4z"/><path d="M9 8h11v11H9z"/></svg>
    </button>

    <button id="shutter" class="round round--shutter" aria-label="촬영"></button>

    <button id="auto" class="round round--side" aria-pressed="false" aria-label="자동 촬영">
      <span class="round__label">AUTO</span>
    </button>
  </div>

  <div class="extras">
    <button id="pick" class="chip">사진 불러오기</button>
    <button id="manual" class="chip" aria-pressed="true" title="촬영한 뒤 문서 영역을 직접 확인합니다">영역 확인</button>
    <button id="torch" class="chip" hidden>플래시</button>
    <button id="flip" class="chip" hidden>카메라 전환</button>
    <button id="save" class="chip chip--primary" disabled>PDF 저장</button>
  </div>
</footer>

<section id="editor" class="editor" hidden aria-label="문서 영역 선택">
  <header class="editor__head">
    <span id="editor-hint" class="editor__hint"></span>
    <span id="editor-size" class="editor__size"></span>
  </header>
  <div class="editor__stage">
    <canvas id="editor-canvas" class="editor__canvas"></canvas>
  </div>
  <div class="editor__tools">
    <button id="editor-auto" class="chip">자동 감지</button>
    <button id="editor-all" class="chip">전체</button>
    <button id="editor-straight" class="chip">직선으로</button>
    <button id="editor-flatten" class="chip" aria-pressed="true" title="휜 페이지를 펴서 저장합니다">평탄화</button>
  </div>
  <footer class="editor__actions">
    <button id="editor-cancel" class="chip">취소</button>
    <button id="editor-apply" class="chip chip--primary">확인</button>
  </footer>
</section>

<dialog id="sheet" class="sheet">
  <header class="sheet__bar">
    <h2>촬영한 페이지 <span id="sheet-count">0</span>장</h2>
    <button id="sheet-close" class="chip chip--ghost">닫기</button>
  </header>
  <div id="thumbs" class="thumbs"></div>
  <p id="sheet-empty" class="sheet__empty">아직 촬영한 페이지가 없습니다.</p>
  <footer class="sheet__actions">
    <button id="sheet-images" class="chip">이미지로 저장</button>
    <button id="sheet-clear" class="chip chip--danger">모두 지우기</button>
    <button id="sheet-pdf" class="chip chip--primary">PDF 저장</button>
  </footer>
</dialog>

<dialog id="viewer" class="viewer" aria-label="페이지 크게 보기">
  <header class="viewer__bar">
    <span id="viewer-position" class="viewer__position">1 / 1</span>
    <span id="viewer-hint" class="viewer__hint"></span>
    <button id="viewer-close" class="chip chip--ghost">닫기</button>
  </header>
  <div id="viewer-stage" class="viewer__stage">
    <img id="viewer-image" class="viewer__image" alt="">
    <button id="viewer-previous" class="viewer__step viewer__step--previous"
            aria-label="이전 페이지">‹</button>
    <button id="viewer-next" class="viewer__step viewer__step--next"
            aria-label="다음 페이지">›</button>
  </div>
  <footer class="viewer__actions">
    <button id="viewer-rotate" class="chip">회전</button>
    <button id="viewer-save" class="chip">저장</button>
    <button id="viewer-remove" class="chip chip--danger">삭제</button>
  </footer>
</dialog>

<input id="file" type="file" accept="image/*" multiple hidden>

<script type="module" src="./js/app.js"></script>
</body>
</html>
