# docscan is packaged as its own distribution: it lives inside the PyCAM
# repository but is not part of the PyCAM package (see ../setup.py).
#
#     pip install ./docscan          # from the repository root
#     docscan camera

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "docscan"
description = "Turn photos of documents into clean, deskewed scans (PDF or image)"
readme = "README.md"
requires-python = ">=3.7"
license = {text = "GPL-3.0-or-later"}
authors = [{name = "PyCAM contributors"}]
keywords = ["scanner", "document", "camera", "perspective", "opencv", "pdf"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics :: Capture",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Utilities",
]
dynamic = ["version"]
dependencies = [
    "numpy>=1.20",
    # the GUI build, because the live camera preview needs a window.  On a
    # machine without a display, install opencv-python-headless yourself and
    # add this package with "pip install ./docscan --no-deps".
    "opencv-python>=4.5",
]

[project.urls]
Homepage = "https://github.com/SebKuzminsky/pycam"
Documentation = "https://github.com/SebKuzminsky/pycam/blob/master/docscan/README.md"

[project.scripts]
docscan = "docscan.cli:main"


[tool.setuptools.dynamic]
version = {attr = "docscan.VERSION"}

# the project directory *is* the package directory
[tool.setuptools]
packages = ["docscan", "docscan.tests"]

[tool.setuptools.package-dir]
docscan = "."
"docscan.tests" = "tests"
